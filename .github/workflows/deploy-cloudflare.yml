name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INVITE_CODE: ${{ secrets.INVITE_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check.mjs

      - name: Prepare Wrangler config
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID || "";
          if (!databaseId) {
            throw new Error("Missing CLOUDFLARE_D1_DATABASE_ID repository secret");
          }
          const template = readFileSync("cloudflare/wrangler.template.jsonc", "utf8");
          writeFileSync("wrangler.generated.jsonc", template.replace("__D1_DATABASE_ID__", databaseId), "utf8");
          NODE
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure invite code
        if: ${{ env.INVITE_CODE != '' }}
        run: printf "%s" "$INVITE_CODE" | npx --yes wrangler@latest secret put INVITE_CODE --config wrangler.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
