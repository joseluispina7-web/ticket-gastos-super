<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Gastos Super</title>
  <style>
    :root {
      --ink: #10211a;
      --muted: #66746b;
      --forest: #183426;
      --forest-2: #244b37;
      --paper: #f6f1e9;
      --card: #ebe8df;
      --line: rgba(16, 33, 26, 0.13);
      --green: #4b8758;
      --orange: #bd6a36;
      --blue: #3f7b91;
      --gold: #bd9930;
      --purple: #7154a5;
      --red: #c76565;
      --shadow: 0 18px 50px rgba(3, 16, 10, 0.18);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, #183426 0%, #1d3c2c 46%, #283322 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(420px, 100%);
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .auth-card h1,
    .panel h2,
    .section-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 800;
      color: var(--ink);
    }

    .auth-card h1 { font-size: 34px; line-height: 1; }
    .auth-card p { margin: 8px 0 22px; color: var(--muted); }

    .field { display: grid; gap: 7px; margin: 12px 0; }
    .field span { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 800; }
    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf3;
      border-radius: 8px;
      padding: 12px 13px;
      color: var(--ink);
      outline: none;
    }
    textarea { min-height: 130px; resize: vertical; }
    input:focus,
    select:focus,
    textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(75, 135, 88, 0.18); }

    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .primary,
    .secondary,
    .ghost,
    .danger {
      border-radius: 8px;
      padding: 11px 15px;
      font-weight: 850;
      min-height: 42px;
    }
    .primary { background: var(--ink); color: #fffaf3; }
    .secondary { background: #d9e7d8; color: var(--forest); }
    .ghost { background: rgba(255, 255, 255, 0.62); color: var(--forest); border: 1px solid var(--line); }
    .danger { background: #f4d6d2; color: #8a2c21; }
    .linkish { color: var(--forest); background: transparent; padding: 0; font-weight: 800; }
    .error { min-height: 20px; color: #a3382a; font-weight: 800; margin-top: 12px; }

    .app {
      min-height: 100vh;
      padding: 20px clamp(14px, 2.4vw, 34px) 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #fffaf3;
      margin-bottom: 18px;
    }
    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 4vw, 46px);
      line-height: 1;
    }
    .brand p { margin: 5px 0 0; color: rgba(255, 250, 243, 0.74); }
    .top-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .top-controls input { width: 150px; background: #fffaf3; }
    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 250, 243, 0.11);
      border: 1px solid rgba(255, 250, 243, 0.2);
      font-weight: 850;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi {
      background: var(--card);
      border-radius: 8px;
      padding: 18px 20px;
      min-height: 108px;
      display: grid;
      align-content: center;
      box-shadow: var(--shadow);
    }
    .kpi span {
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 850;
      font-size: 13px;
    }
    .kpi strong {
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 3.8vw, 41px);
      line-height: 1;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(340px, 0.85fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--paper);
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.45);
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 18px;
    }
    .panel h2 { font-size: 31px; }
    .subtle { color: var(--muted); margin: 4px 0 0; font-weight: 600; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 7px 9px;
      background: #dde9dc;
      color: var(--forest);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .chart-wrap {
      display: grid;
      grid-template-columns: minmax(280px, 0.95fr) minmax(280px, 1fr);
      gap: 24px;
      align-items: center;
    }
    .donut {
      width: min(520px, 100%);
      aspect-ratio: 1;
      display: block;
      margin: auto;
    }
    .donut .track { fill: none; stroke: #e5ded3; stroke-width: 30; }
    .donut path { fill: none; stroke-width: 30; }
    .donut-center {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
      font-size: 17px;
      fill: var(--ink);
    }
    .donut-label { fill: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; }
    .legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px 18px;
    }
    .legend-item {
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 9px;
      align-items: center;
      min-width: 0;
      font-weight: 750;
    }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .legend-item span:last-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side-stack { display: grid; gap: 20px; }
    .section-title { font-size: 23px; margin-bottom: 13px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      text-align: left;
      color: var(--muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(16, 33, 26, 0.08);
      vertical-align: middle;
    }
    td:last-child,
    th:last-child { text-align: right; }
    .amount { font-weight: 900; white-space: nowrap; }
    .muted { color: var(--muted); }

    .trend { display: grid; gap: 10px; }
    .trend-row {
      display: grid;
      grid-template-columns: 58px 1fr 82px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }
    .bar {
      height: 9px;
      border-radius: 999px;
      background: #ded7ca;
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; background: var(--orange); border-radius: inherit; }

    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(720px, 100vw);
      background: var(--paper);
      color: var(--ink);
      box-shadow: -18px 0 60px rgba(0, 0, 0, 0.26);
      z-index: 20;
      padding: 20px;
      overflow: auto;
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .drawer h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
    }
    .dropzone {
      border: 1px dashed rgba(16, 33, 26, 0.35);
      border-radius: 8px;
      background: #fffaf3;
      padding: 16px;
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }
    .dropzone input { background: #fff; }
    .status {
      min-height: 22px;
      color: var(--muted);
      font-weight: 750;
    }
    .review-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 18px;
    }
    .review-table input,
    .review-table select {
      padding: 8px 9px;
      background: #fffaf3;
    }
    .review-table th:nth-child(1),
    .review-table td:nth-child(1) { width: 34%; }
    .review-table th:nth-child(4),
    .review-table td:nth-child(4) { width: 110px; }
    .mini-button {
      min-width: 34px;
      min-height: 34px;
      border-radius: 8px;
      background: #f1ded9;
      color: #873124;
      font-weight: 900;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      font-weight: 950;
      font-size: 18px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 15, 10, 0.34);
      z-index: 19;
    }

    @media (max-width: 1050px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .chart-wrap { grid-template-columns: 1fr; }
      .legend { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .app { padding: 14px 10px 24px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .top-controls { justify-content: stretch; }
      .top-controls > * { flex: 1 1 120px; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
      .kpi { min-height: 86px; padding: 13px; }
      .kpi span { font-size: 11px; }
      .kpi strong { font-size: 24px; }
      .panel { padding: 17px 15px; }
      .panel h2 { font-size: 25px; }
      .review-meta { grid-template-columns: 1fr; }
      table { font-size: 12px; }
      th, td { padding: 8px 5px; }
    }
  </style>
</head>
<body>
  <section id="authView" class="auth">
    <div class="auth-card">
      <h1>Ticket Gastos Super</h1>
      <p>Panel privado de tickets y categorias.</p>
      <label class="field">
        <span>Usuario</span>
        <input id="authUsername" autocomplete="username" placeholder="jose">
      </label>
      <label class="field">
        <span>Contrasena</span>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="minimo 6 caracteres">
      </label>
      <label class="field">
        <span>Codigo invitacion</span>
        <input id="authInvite" autocomplete="one-time-code" placeholder="solo para crear usuario">
      </label>
      <div class="actions">
        <button id="loginBtn" class="primary">Entrar</button>
        <button id="registerBtn" class="secondary">Crear usuario</button>
      </div>
      <div id="authError" class="error"></div>
    </div>
  </section>

  <main id="appView" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <h1>Compra Clara</h1>
        <p id="monthTitle">Resumen mensual</p>
      </div>
      <div class="top-controls">
        <input id="monthInput" type="month">
        <button id="openImportBtn" class="secondary">Importar ticket</button>
        <span id="userPill" class="user-pill"></span>
        <button id="logoutBtn" class="ghost">Salir</button>
      </div>
    </header>

    <section id="kpiGrid" class="kpis"></section>

    <section class="grid">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Gasto por categoria</h2>
            <p id="chartSubtitle" class="subtle">Distribucion total del mes</p>
          </div>
          <span id="demoBadge" class="badge" hidden>Ejemplo visual</span>
        </div>
        <div class="chart-wrap">
          <svg id="categoryChart" class="donut" viewBox="0 0 220 220" role="img" aria-label="Gasto por categoria"></svg>
          <div id="categoryLegend" class="legend"></div>
        </div>
      </section>

      <aside class="side-stack">
        <section class="panel">
          <h2 class="section-title">Historico anual</h2>
          <div id="trendPanel" class="trend"></div>
        </section>
        <section class="panel">
          <h2 class="section-title">Top productos</h2>
          <div id="topProducts"></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2 class="section-title">Tickets recientes</h2>
            <span id="userLimit" class="badge"></span>
          </div>
          <div id="receiptList"></div>
        </section>
      </aside>
    </section>
  </main>

  <div id="drawerOverlay" class="overlay" hidden></div>
  <aside id="importDrawer" class="drawer" hidden>
    <div class="drawer-head">
      <h2>Importar ticket</h2>
      <button id="closeDrawerBtn" class="ghost">Cerrar</button>
    </div>
    <div class="dropzone">
      <input id="ticketFile" type="file" accept="application/pdf,image/*,.txt">
      <textarea id="rawText" placeholder="Texto del ticket"></textarea>
      <div class="actions">
        <button id="extractBtn" class="secondary">Leer archivo</button>
        <button id="parseBtn" class="primary">Preparar revision</button>
        <button id="sampleBtn" class="ghost">Ejemplo</button>
      </div>
      <div id="importStatus" class="status"></div>
    </div>

    <section id="reviewPanel" hidden>
      <div class="review-meta">
        <label class="field">
          <span>Supermercado</span>
          <input id="reviewStore">
        </label>
        <label class="field">
          <span>Fecha</span>
          <input id="reviewDate" type="date">
        </label>
        <label class="field">
          <span>Total ticket</span>
          <input id="reviewTotal" type="number" min="0" step="0.01">
        </label>
      </div>
      <table class="review-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoria</th>
            <th>Cant.</th>
            <th>Importe</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="reviewRows"></tbody>
      </table>
      <div class="total-row">
        <span>Total lineas</span>
        <strong id="reviewComputedTotal">0,00 EUR</strong>
      </div>
      <div class="actions">
        <button id="addRowBtn" class="secondary">Anadir linea</button>
        <button id="saveReceiptBtn" class="primary">Guardar ticket</button>
      </div>
    </section>
  </aside>

  <script>

    var DEMO = {

      },
      categories: [

        ["Bebe", 37.15], ["Limpieza", 35.40], ["Cereales y pasta", 32.95], ["Platos y conservas", 21.65],
        ["Pescado", 10.70], ["Dulces y snacks", 9.35], ["Frutos secos", 7.90], ["Congelados", 4.50],

      ].map(function(item) {

      }),

    };

    var els = {

      topProducts: document.getElementById("topProducts"),
      receiptList: document.getElementById("receiptList"),
      drawer: document.getElementById("importDrawer"),
      overlay: document.getElementById("drawerOverlay"),
      closeDrawerBtn: document.getElementById("closeDrawerBtn"),

      reviewDate: document.getElementById("reviewDate"),

    };

    var state = {
      user: null,
      dashboard: null,
      month: new Date().toISOString().slice(0, 7),
      review: null
    };

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function(char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char];
      });
    }

    function euro(value) {
      return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(Number(value || 0));
    }

    function percent(value) {
      return new Intl.NumberFormat("es-ES", { maximumFractionDigits: 1 }).format(Number(value || 0)) + "%";
    }

    function monthLabel(month) {
      var date = new Date(month + "-01T00:00:00");
      return new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" }).format(date);
    }

    async function api(path, options) {
      var response = await fetch(path, Object.assign({
        headers: { "content-type": "application/json" }
      }, options || {}));
      var data = await response.json().catch(function() { return {}; });
      if (!response.ok) throw new Error(data.error || "Error");
      return data;
    }

    function showAuth() {
      els.authView.hidden = false;
      els.appView.hidden = true;
    }

    function showApp() {
      els.authView.hidden = true;
      els.appView.hidden = false;
    }

    async function auth(mode) {
      els.authError.textContent = "";
      var username = els.username.value.trim();
      var password = els.password.value;
      var inviteCode = els.invite.value.trim();
      try {
        var result = await api(mode === "register" ? "/api/register" : "/api/login", {
          method: "POST",
          body: JSON.stringify({ username: username, password: password, inviteCode: inviteCode })
        });
        state.user = result.user;
        showApp();
        await loadDashboard();
      } catch (error) {
        els.authError.textContent = error.message;
      }
    }

    async function logout() {
      await api("/api/logout", { method: "POST", body: "{}" }).catch(function() {});
      state.user = null;
      showAuth();
    }

    async function loadDashboard() {
      els.monthInput.value = state.month;
      var data = await api("/api/dashboard?month=" + encodeURIComponent(state.month));
      state.dashboard = data;
      state.user = data.user;
      renderDashboard(data);
    }

    function activeSummary(data) {
      var hasRealData = data.items && data.items.length > 0;
      if (hasRealData) return { demo: false, summary: data.summary, receipts: data.receipts, trend: data.trend, topProducts: data.summary.topProducts };
      return {
        demo: true,
        summary: {
          kpis: DEMO.kpis,
          categories: DEMO.categories,
          topProducts: DEMO.topProducts
        },
        receipts: DEMO.receipts,
        trend: DEMO.trend,
        topProducts: DEMO.topProducts
      };
    }

    function renderDashboard(data) {
      var view = activeSummary(data);
      var summary = view.summary;
      els.userPill.textContent = data.user.username;
      els.userLimit.textContent = data.userCount + "/" + data.maxUsers + " usuarios";
      els.monthTitle.textContent = monthLabel(state.month);
      els.demoBadge.hidden = !view.demo;
      els.chartSubtitle.textContent = view.demo ? "Distribucion de ejemplo" : "Distribucion total del mes";
      renderKpis(summary.kpis);
      renderDonut(summary.categories, summary.kpis.total);
      renderLegend(summary.categories, summary.kpis.total);
      renderTrend(view.trend);
      renderTopProducts(view.topProducts);
      renderReceipts(view.receipts, view.demo);
    }

    function renderKpis(kpis) {
      var top = kpis.topCategory ? kpis.topCategory.category + " · " + euro(kpis.topCategory.amount) : "Sin datos";
      els.kpiGrid.innerHTML = [
        ["Total mes", euro(kpis.total)],
        ["Tickets", kpis.receipts],
        ["Productos unicos", kpis.uniqueProducts],
        ["Top categoria", top]
      ].map(function(card) {
        return "<article class=\"kpi\"><span>" + escapeHtml(card[0]) + "</span><strong>" + escapeHtml(card[1]) + "</strong></article>";
      }).join("");
    }

    function polar(cx, cy, radius, angle) {
      var radians = (angle - 90) * Math.PI / 180;
      return { x: cx + radius * Math.cos(radians), y: cy + radius * Math.sin(radians) };
    }

    function arcPath(cx, cy, radius, startAngle, endAngle) {
      var start = polar(cx, cy, radius, endAngle);
      var end = polar(cx, cy, radius, startAngle);
      var large = endAngle - startAngle <= 180 ? "0" : "1";
      return ["M", start.x, start.y, "A", radius, radius, 0, large, 0, end.x, end.y].join(" ");
    }

    function renderDonut(categories, total) {
      var html = "<circle class=\"track\" cx=\"110\" cy=\"110\" r=\"72\"></circle>";
      if (!categories.length || !total) {
        html += "<text x=\"110\" y=\"107\" text-anchor=\"middle\" class=\"donut-center\">0 EUR</text><text x=\"110\" y=\"124\" text-anchor=\"middle\" class=\"donut-label\">sin tickets</text>";
        els.chart.innerHTML = html;
        return;
      }
      var angle = 0;
      categories.forEach(function(item) {
        var slice = Math.max((item.amount / total) * 360, 0.4);
        var end = Math.min(angle + slice, 359.99);
        html += "<path d=\"" + arcPath(110, 110, 72, angle, end) + "\" stroke=\"" + (CATEGORY_COLORS[item.category] || CATEGORY_COLORS.Otros) + "\"></path>";
        angle += slice;
      });
      html += "<text x=\"110\" y=\"106\" text-anchor=\"middle\" class=\"donut-center\">" + escapeHtml(euro(total).replace("\u20ac", "EUR")) + "</text>";
      html += "<text x=\"110\" y=\"124\" text-anchor=\"middle\" class=\"donut-label\">total mes</text>";
      els.chart.innerHTML = html;
    }

    function renderLegend(categories, total) {
      els.legend.innerHTML = categories.map(function(item) {
        return "<div class=\"legend-item\"><i class=\"swatch\" style=\"background:" + (CATEGORY_COLORS[item.category] || CATEGORY_COLORS.Otros) + "\"></i><span>" +
          escapeHtml(item.category) + " " + escapeHtml(euro(item.amount)) + " (" + escapeHtml(percent(total ? item.amount / total * 100 : 0)) + ")</span></div>";
      }).join("");
    }

    function renderTrend(trend) {
      var rows = (trend || []).length ? trend : [];
      if (!rows.length) {
        els.trendPanel.innerHTML = "<p class=\"muted\">Sin meses guardados.</p>";
        return;
      }
      var max = Math.max.apply(null, rows.map(function(row) { return Number(row.total || 0); })) || 1;
      els.trendPanel.innerHTML = rows.map(function(row) {
        var label = row.month.slice(5) + "/" + row.month.slice(2, 4);
        var width = Math.max((Number(row.total || 0) / max) * 100, 3);
        return "<div class=\"trend-row\"><span>" + escapeHtml(label) + "</span><span class=\"bar\"><i style=\"width:" + width + "%\"></i></span><strong>" + escapeHtml(euro(row.total)) + "</strong></div>";
      }).join("");
    }

    function renderTopProducts(products) {
      if (!products || !products.length) {
        els.topProducts.innerHTML = "<p class=\"muted\">Sin productos todavia.</p>";
        return;
      }
      els.topProducts.innerHTML = "<table><thead><tr><th>Producto</th><th>Total</th></tr></thead><tbody>" +
        products.map(function(product) {
          return "<tr><td><strong>" + escapeHtml(product.name) + "</strong><br><span class=\"muted\">" + escapeHtml(product.category) + " · " + escapeHtml(product.count || 1) + " veces</span></td><td class=\"amount\">" + escapeHtml(euro(product.total)) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }

    function renderReceipts(receipts, demo) {
      if (!receipts || !receipts.length) {
        els.receiptList.innerHTML = "<p class=\"muted\">Sin tickets en este mes.</p>";
        return;
      }
      els.receiptList.innerHTML = "<table><thead><tr><th>Tienda</th><th>Total</th><th></th></tr></thead><tbody>" +
        receipts.map(function(receipt) {
          return "<tr><td><strong>" + escapeHtml(receipt.store) + "</strong><br><span class=\"muted\">" + escapeHtml(receipt.receipt_date) + "</span></td><td class=\"amount\">" + escapeHtml(euro(receipt.total)) + "</td><td>" +
            (demo ? "" : "<button class=\"mini-button\" data-delete=\"" + escapeHtml(receipt.id) + "\">x</button>") + "</td></tr>";
        }).join("") + "</tbody></table>";
    }

    function openDrawer() {
      els.drawer.hidden = false;
      els.overlay.hidden = false;
    }

    function closeDrawer() {
      els.drawer.hidden = true;
      els.overlay.hidden = true;
    }

    function setStatus(text) {
      els.importStatus.textContent = text || "";
    }

    async function extractFile() {
      var file = els.ticketFile.files[0];
      if (!file) {
        setStatus("Elige un archivo.");
        return;
      }
      setStatus("Leyendo " + file.name + "...");
      try {
        var text = "";
        if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
          text = await extractPdf(file);
        } else if (file.type.indexOf("image/") === 0) {
          text = await extractImage(file);
        } else {
          text = await file.text();
        }
        els.rawText.value = text.trim();
        setStatus(text.trim() ? "Texto detectado." : "No se ha detectado texto.");
      } catch (error) {
        setStatus("No he podido leerlo automaticamente. Puedes pegar el texto.");
      }
    }

    async function extractPdf(file) {
      var pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs");
      pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";
      var buffer = await file.arrayBuffer();
      var pdf = await pdfjs.getDocument({ data: new Uint8Array(buffer) }).promise;
      var chunks = [];
      for (var pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        var page = await pdf.getPage(pageNumber);
        var content = await page.getTextContent();
        chunks.push(content.items.map(function(item) { return item.str; }).join("\n"));
      }
      return chunks.join("\n");
    }

    async function extractImage(file) {
      setStatus("OCR local en curso...");
      var mod = await import("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js");
      var worker = await mod.createWorker("spa");
      var result = await worker.recognize(file);
      await worker.terminate();
      return result.data.text || "";
    }

    function normalizeProduct(name) {
      return String(name || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\b\d+\b/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function detectStore(text) {
      var upper = text.toUpperCase();
      if (upper.indexOf("MERCADONA") !== -1) return "Mercadona";
      if (upper.indexOf("CARREFOUR") !== -1) return "Carrefour";
      if (upper.indexOf("LIDL") !== -1) return "Lidl";
      if (upper.indexOf("ALCAMPO") !== -1) return "Alcampo";
      if (upper.indexOf("CONSUM") !== -1) return "Consum";
      if (upper.indexOf("DIA") !== -1) return "Dia";
      return "Supermercado";
    }

    function detectDate(text) {
      var match = text.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/);
      if (match) return match[3] + "-" + String(match[2]).padStart(2, "0") + "-" + String(match[1]).padStart(2, "0");
      var iso = text.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
      if (iso) return iso[0];
      return new Date().toISOString().slice(0, 10);
    }

    function parseMoney(token) {
      var clean = String(token || "").replace(/\s/g, "").replace(/[^\d,.-]/g, "");
      if (clean.indexOf(",") !== -1) clean = clean.replace(/\./g, "").replace(",", ".");
      var number = Number(clean);
      return Number.isFinite(number) ? number : 0;
    }

    function detectTotal(lines, items) {
      for (var index = lines.length - 1; index >= 0; index -= 1) {
        var line = lines[index];
        if (/total|importe|a pagar/i.test(line)) {
          var match = line.match(/(-?\d{1,5}(?:[.,]\d{2}))\s*$/);
          if (match) return parseMoney(match[1]);
        }
      }
      return items.reduce(function(sum, item) { return sum + item.lineTotal; }, 0);
    }

    function guessCategory(name) {
      var normalized = normalizeProduct(name);
      var rules = (state.dashboard && state.dashboard.rules) || [];
      for (var i = 0; i < rules.length; i += 1) {
        if (rules[i].normalized_name === normalized) return rules[i].category;
      }
      for (var k = 0; k < KEYWORDS.length; k += 1) {
        var category = KEYWORDS[k][0];
        var words = KEYWORDS[k][1];
        for (var w = 0; w < words.length; w += 1) {
          if (normalized.indexOf(words[w]) !== -1) return category;
        }
      }
      return "Otros";
    }

    function isNoise(line) {
      return /iva|subtotal|total|tarjeta|visa|mastercard|cambio|entregado|factura|cajero|telefono|cif|nif|parking|club|puntos|ahorro|descuento/i.test(line);
    }

    function parseReceiptText(text) {
      var lines = String(text || "").split(/\r?\n/).map(function(line) {
        return line.replace(/\s+/g, " ").trim();
      }).filter(Boolean);
      var items = [];
      lines.forEach(function(line) {
        if (line.length < 4 || isNoise(line)) return;
        var match = line.match(/(-?\d{1,5}(?:[.,]\d{2}))\s*(?:EUR|E)?\s*$/i);
        if (!match) return;
        var amount = parseMoney(match[1]);
        if (!Number.isFinite(amount) || amount <= 0) return;
        var name = line.slice(0, line.lastIndexOf(match[1])).trim();
        name = name.replace(/^\d{2,}\s+/, "").replace(/\b\d+\s*x\s*\d+[,.]\d+\b/ig, "").replace(/\s+/g, " ").trim();
        if (name.length < 3 || /^\d+$/.test(name)) return;
        items.push({
          name: name.slice(0, 80),
          category: guessCategory(name),
          quantity: 1,
          unitPrice: amount,
          lineTotal: amount
        });
      });
      return {
        store: detectStore(text),
        date: detectDate(text),
        sourceName: (els.ticketFile.files[0] && els.ticketFile.files[0].name) || "",
        rawText: text,
        items: items.slice(0, 180),
        total: detectTotal(lines, items)
      };
    }

    function loadSample() {
      els.rawText.value = [
        "MERCADONA",
        "08/08/2026",
        "PECHUGA POLLO 7,80",
        "YOGUR GRIEGO 2,45",
        "PLATANO CANARIAS 3,12",
        "TOMATE ENSALADA 2,90",
        "PAN INTEGRAL 1,35",
        "DETERGENTE LIQUIDO 6,40",
        "AGUA MINERAL 2,10",
        "TOTAL 26,12"
      ].join("\n");
      setStatus("Ejemplo cargado.");
    }

    function prepareReview() {
      var parsed = parseReceiptText(els.rawText.value);
      if (!parsed.items.length) {
        parsed.items = [{ name: "", category: "Otros", quantity: 1, unitPrice: 0, lineTotal: 0 }];
      }
      state.review = parsed;
      els.reviewStore.value = parsed.store;
      els.reviewDate.value = parsed.date;
      els.reviewTotal.value = parsed.total.toFixed(2);
      els.reviewPanel.hidden = false;
      renderReviewRows();
      setStatus(parsed.items.length + " lineas preparadas.");
    }

    function categoryOptions(selected) {
      var categories = (state.dashboard && state.dashboard.categories) || Object.keys(CATEGORY_COLORS);
      return categories.map(function(category) {
        return "<option value=\"" + escapeHtml(category) + "\"" + (category === selected ? " selected" : "") + ">" + escapeHtml(category) + "</option>";
      }).join("");
    }

    function renderReviewRows() {
      var items = state.review ? state.review.items : [];
      els.reviewRows.innerHTML = items.map(function(item, index) {
        return "<tr data-row=\"" + index + "\">" +
          "<td><input data-field=\"name\" value=\"" + escapeHtml(item.name) + "\"></td>" +
          "<td><select data-field=\"category\">" + categoryOptions(item.category) + "</select></td>" +
          "<td><input data-field=\"quantity\" type=\"number\" min=\"0.001\" step=\"0.001\" value=\"" + escapeHtml(item.quantity || 1) + "\"></td>" +
          "<td><input data-field=\"lineTotal\" type=\"number\" min=\"0\" step=\"0.01\" value=\"" + escapeHtml(Number(item.lineTotal || 0).toFixed(2)) + "\"></td>" +
          "<td><button class=\"mini-button\" data-remove=\"" + index + "\">x</button></td>" +
          "</tr>";
      }).join("");
      updateReviewTotal();
    }

    function updateReviewTotal() {
      var total = (state.review ? state.review.items : []).reduce(function(sum, item) {
        return sum + Number(item.lineTotal || 0);
      }, 0);
      els.reviewComputedTotal.textContent = euro(total);
      if (!Number(els.reviewTotal.value)) els.reviewTotal.value = total.toFixed(2);
    }

    function updateReviewField(target) {
      var row = target.closest("tr");
      if (!row || !state.review) return;
      var index = Number(row.dataset.row);
      var field = target.dataset.field;
      var value = target.value;
      if (field === "quantity" || field === "lineTotal") value = Number(value || 0);
      state.review.items[index][field] = value;
      if (field === "name" && state.review.items[index].category === "Otros") {
        state.review.items[index].category = guessCategory(value);
        renderReviewRows();
      }
      updateReviewTotal();
    }

    async function saveReceipt() {
      if (!state.review) return;
      state.review.store = els.reviewStore.value;
      state.review.date = els.reviewDate.value;
      state.review.total = Number(els.reviewTotal.value || 0);
      state.review.items = state.review.items.filter(function(item) {
        return String(item.name || "").trim();
      }).map(function(item) {
        var quantity = Number(item.quantity || 1);
        var lineTotal = Number(item.lineTotal || 0);
        return Object.assign({}, item, {
          quantity: quantity,
          unitPrice: quantity ? lineTotal / quantity : lineTotal,
          lineTotal: lineTotal
        });
      });
      if (!state.review.items.length) {
        setStatus("No hay lineas para guardar.");
        return;
      }
      setStatus("Guardando...");
      try {
        await api("/api/receipts", { method: "POST", body: JSON.stringify(state.review) });
        closeDrawer();
        state.review = null;
        els.rawText.value = "";
        els.ticketFile.value = "";
        els.reviewPanel.hidden = true;
        await loadDashboard();
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function deleteReceipt(id) {
      await api("/api/receipts/" + encodeURIComponent(id), { method: "DELETE" });
      await loadDashboard();
    }

    els.loginBtn.addEventListener("click", function() { auth("login"); });
    els.registerBtn.addEventListener("click", function() { auth("register"); });
    els.password.addEventListener("keydown", function(event) { if (event.key === "Enter") auth("login"); });
    els.logoutBtn.addEventListener("click", logout);
    els.monthInput.addEventListener("change", function() {
      state.month = els.monthInput.value || state.month;
      loadDashboard();
    });
    els.openImportBtn.addEventListener("click", openDrawer);
    els.closeDrawerBtn.addEventListener("click", closeDrawer);
    els.overlay.addEventListener("click", closeDrawer);
    els.extractBtn.addEventListener("click", extractFile);
    els.parseBtn.addEventListener("click", prepareReview);
    els.sampleBtn.addEventListener("click", loadSample);
    els.addRowBtn.addEventListener("click", function() {
      if (!state.review) prepareReview();
      state.review.items.push({ name: "", category: "Otros", quantity: 1, unitPrice: 0, lineTotal: 0 });
      renderReviewRows();
    });
    els.saveReceiptBtn.addEventListener("click", saveReceipt);
    els.reviewRows.addEventListener("input", function(event) {
      if (event.target.dataset.field) updateReviewField(event.target);
    });
    els.reviewRows.addEventListener("change", function(event) {
      if (event.target.dataset.field) updateReviewField(event.target);
    });
    els.reviewRows.addEventListener("click", function(event) {
      var remove = event.target.dataset.remove;
      if (remove == null || !state.review) return;
      state.review.items.splice(Number(remove), 1);
      renderReviewRows();
    });
    els.receiptList.addEventListener("click", function(event) {
      var id = event.target.dataset.delete;
      if (id) deleteReceipt(id);
    });

    (async function boot() {
      els.monthInput.value = state.month;
      try {
        var me = await api("/api/me");
        state.user = me.user;
        showApp();
        await loadDashboard();
      } catch (_error) {
        showAuth();
      }
    })();
  </script>
</body>
</html>
